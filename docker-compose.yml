version: '3.8'

services:
  fedtrust:
    build:
      context: .
      dockerfile: Dockerfile
    image: fedtrust-k8s:latest
    container_name: fedtrust-k8s
    volumes:
      - ./datasets:/app/datasets
      - ./results:/app/results
    environment:
      - PYTHONPATH=/app
    command: experiments/00_baseline.py

  # For Jupyter development
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: fedtrust-k8s:latest
    container_name: fedtrust-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./datasets:/app/datasets
      - ./results:/app/results
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONPATH=/app
    command: jupyter-lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root