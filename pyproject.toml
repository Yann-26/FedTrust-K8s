[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedtrust-k8s"
version = "0.1.0"
description = "Trustworthy Federated Learning experiments with Flower, PyTorch and Kubernetes"
requires-python = ">=3.10"
dependencies = [
    "flwr",
    "torch",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["flower"]

[tool.flwr.app]
publisher = "fedtrust-k8s"

[tool.flwr.app.components]
serverapp = "flower.server_app:app"
clientapp = "flower.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1
learning-rate = 0.001
batch-size = 64


